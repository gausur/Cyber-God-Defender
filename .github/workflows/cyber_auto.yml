name: Cyber-Defender-Continuous
on:
  schedule:
    - cron: '0 * * * *'       # প্রতি ঘণ্টায় রান (তুমি চাইলে '0 */6 * * *' দিতে পারো)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyber-nonstop
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Master Cyber
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SHERLOCK_MODELS_API: ${{ secrets.SHERLOCK_MODELS_API }}
          IPINFOLITE_API_KEY: ${{ secrets.IPINFOLITE_API_KEY }}
          ALIENVAULT_API_KEY: ${{ secrets.ALIENVAULT_API_KEY }}
        run: python master_cyber.py
